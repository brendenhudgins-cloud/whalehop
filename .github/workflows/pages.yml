# Deploy whalehop.net to GitHub Pages, refreshing the three feeds on the way out.
#
# HISTORICAL NOTE, kept because it explains the shape of this file: the feed fetch used to
# run HERE, inside the deploy job, and the paragraph below is why it was not a separate
# workflow. It now runs on a developer machine instead -- see the "Refresh feeds" gap below --
# because tools/feeds.mjs was removed from this public repo along with the rest of the tools.
#
# ONE WORKFLOW, NOT TWO, AND THAT IS THE WHOLE TRICK. The obvious split — a "refresh feeds"
# job that commits feeds.json, and a separate "deploy" job triggered by that commit — does
# not work: a push made with the built-in GITHUB_TOKEN deliberately does NOT trigger further
# workflow runs, so the deploy would never fire and the site would only update when a human
# happened to push. Fetching inside the deploy job avoids the problem entirely, and has the
# side benefit of producing no bot commits at all.
#
# The feeds.json committed here is therefore a SEED and a local-preview fallback, not what
# visitors get. Visitors get whatever this job fetched.

name: pages

on:
  push:
    branches: [main]
  schedule:
    # Every six hours. The three sources move on the order of days, not minutes; six hours
    # keeps the "updated Nh ago" line honest without burning free Actions minutes.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled refresh and a push-deploy publish over each other. cancel-in-progress
# is false so an in-flight deploy finishes rather than leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # global fetch is built in from 18

      # THE FEEDS ARE REFRESHED LOCALLY NOW, not here. tools/feeds.mjs is no longer in this
      # repo: the tools drive and describe a private build, and this repo is public, so they
      # were pulled out and the fetch step went with them. What ships is whatever feeds.json
      # was last committed.
      #
      # THE COST IS REAL AND WORTH STATING. Feeds used to refresh every six hours whether or
      # not anyone touched the site; now they are exactly as fresh as the last local run. The
      # "updated Nh ago" line on the page is therefore a claim about when the fetch ran, and
      # it will drift if nobody runs one. Run `node tools/feeds.mjs` (from wherever the tools
      # now live) and commit feeds.json.

      - name: Show what shipped
        run: |
          node -e '
            const f = require("./feeds.json");
            console.log("generated", f.generated);
            for (const [k, v] of Object.entries(f.sources))
              console.log(k.padEnd(9), (v.items?.length ?? 0) + " items",
                          v.error ? "STALE: " + v.error : "");
          '

      - name: Stamp the asset URLs with this commit
        # WHY THIS EXISTS. Pages serves everything with `Cache-Control: max-age=600`, and the
        # artifact is the repo root verbatim, so index.html and assets/site.js are two
        # independently-cached documents with no version linking them. For ten minutes after a
        # deploy a RETURNING visitor can therefore be served NEW html against OLD js — which is
        # not a theoretical worry: it happened on the deploy that added the trailer, and the
        # symptom was a headed, empty <section id="trailer"> and a rail stop pointing at
        # nothing, because the html had the section and the cached js had no renderTrailer to
        # fill it. Measured from the page: executed bundle 18,128 bytes, server copy 20,712.
        #
        # Stamping the query with the commit sha makes the asset URL change whenever the html
        # changes, so a given index.html can only ever load the js it shipped with. It runs on
        # the RUNNER and is never committed: the repo keeps clean `assets/site.js` references,
        # so tools/serve.mjs and a plain file:// open are unaffected and there is still no
        # build step.
        #
        # It asserts both substitutions rather than trusting sed to have matched — a rewrite
        # that silently matches nothing is exactly the shape of check that cannot fail.
        run: |
          node -e '
            const fs = require("fs");
            const v = (process.env.GITHUB_SHA || "dev").slice(0, 8);
            let html = fs.readFileSync("index.html", "utf8");
            for (const asset of ["assets/site.css", "assets/site.js"]) {
              const before = html;
              html = html.replace(asset + "\"", asset + "?v=" + v + "\"");
              if (html === before) {
                console.error("FAILED: no reference to " + asset + " in index.html");
                process.exit(1);
              }
            }
            fs.writeFileSync("index.html", html);
            console.log("stamped assets ?v=" + v);
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # the site is the repo root; CNAME rides along in the artifact, which is what keeps
          # the custom domain attached (there is no gh-pages branch for Pages to write one into)
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
